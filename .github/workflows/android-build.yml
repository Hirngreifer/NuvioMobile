name: Android Build

# Fork-only workflow: builds a signed full-flavor release APK (via the shared
# build-apk.yml) and publishes it as the rolling `android-latest` prerelease so
# it can be installed directly on a phone. The in-app updater only considers
# non-prerelease releases of the fork, so this never interferes with it.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Zusätzlich ein echtes Release (Tag = MARKETING_VERSION) veröffentlichen, das der In-App-Updater anbietet. Vorher Version in iosApp/Configuration/Version.xcconfig bumpen (MARKETING_VERSION und CURRENT_PROJECT_VERSION)."
        type: boolean
        default: false
  push:
    branches: [cmp-rewrite]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Upstream-sync merges are already built, tested and released by
    # upstream-sync.yml before it pushes them — don't build them twice.
    # startsWith against the exact merge message upstream-sync.yml writes;
    # contains() would also skip commits that merely mention the marker.
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Merge upstream cmp-rewrite [upstream-sync]') }}
    uses: ./.github/workflows/build-apk.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      APK_NAME: ${{ needs.build.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nuvio-full-release-apk

      - name: Update rolling android-latest prerelease
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "$APK_NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android dev build (${GITHUB_SHA::7})" \
            --notes "Automatischer Build von \`cmp-rewrite\` @ ${GITHUB_SHA}. Signierte Full-Flavor-Release-APK — direkt auf dem Gerät installierbar."

      # Echtes (non-prerelease) Release: nur auf manuellen Wunsch. Der In-App-Updater
      # bietet ausschließlich solche Releases an (Channel-Match über target=cmp-rewrite,
      # Versionsvergleich Tag vs. installierte Version). Schlägt fehl, wenn der Tag
      # schon existiert — Version vorher in Version.xcconfig bumpen.
      - name: Publish updater release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          VERSION=$(grep MARKETING_VERSION iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')
          gh release create "$VERSION" "$APK_NAME" \
            --target cmp-rewrite \
            --title "Nuvio $VERSION" \
            --notes "Signierter Full-Flavor-Build von \`cmp-rewrite\`. Wird vom In-App-Updater angeboten."
