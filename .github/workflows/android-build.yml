name: Android Build

# Fork-only workflow: builds a signed full-flavor release APK and publishes it
# as the rolling `android-latest` prerelease so it can be installed directly
# on a phone. The in-app updater only considers non-prerelease releases of the
# upstream repo, so this never interferes with it.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Zusätzlich ein echtes Release (Tag = MARKETING_VERSION) veröffentlichen, das der In-App-Updater anbietet. Vorher Version in iosApp/Configuration/Version.xcconfig bumpen (MARKETING_VERSION und CURRENT_PROJECT_VERSION)."
        type: boolean
        default: false
  push:
    branches: [cmp-rewrite]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: printf '%s' "${{ secrets.NUVIO_RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/nuvio-release.keystore"

      - name: Write signing config
        run: |
          cat >> local.properties <<EOF
          NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/nuvio-release.keystore
          NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed full release APK
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_WATCHPARTY_SUPABASE_URL: ${{ secrets.NUVIO_WATCHPARTY_SUPABASE_URL }}
          NUVIO_WATCHPARTY_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_WATCHPARTY_SUPABASE_ANON_KEY }}
        run: ./gradlew :androidApp:assembleFullRelease

      - name: Collect APK
        id: apk
        run: |
          APK_SRC=$(find androidApp/build/outputs/apk/full/release -name '*.apk' -print -quit)
          test -n "$APK_SRC" || { echo "no APK produced"; exit 1; }
          VERSION=$(grep MARKETING_VERSION iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')
          APK="Nuvio-${VERSION}-full-${GITHUB_SHA::7}.apk"
          cp "$APK_SRC" "$APK"
          echo "name=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-release-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Update rolling android-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "${{ steps.apk.outputs.name }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android dev build (${GITHUB_SHA::7})" \
            --notes "Automatischer Build von \`cmp-rewrite\` @ ${GITHUB_SHA}. Signierte Full-Flavor-Release-APK — direkt auf dem Gerät installierbar."

      # Echtes (non-prerelease) Release: nur auf manuellen Wunsch. Der In-App-Updater
      # bietet ausschließlich solche Releases an (Channel-Match über target=cmp-rewrite,
      # Versionsvergleich Tag vs. installierte Version). Schlägt fehl, wenn der Tag
      # schon existiert — Version vorher in Version.xcconfig bumpen.
      - name: Publish updater release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep MARKETING_VERSION iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')
          gh release create "$VERSION" "${{ steps.apk.outputs.name }}" \
            --target cmp-rewrite \
            --title "Nuvio $VERSION" \
            --notes "Signierter Full-Flavor-Build von \`cmp-rewrite\`. Wird vom In-App-Updater angeboten."
