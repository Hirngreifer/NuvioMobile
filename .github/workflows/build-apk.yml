name: Build APK

# Reusable fork build path: keystore, runtime-config secrets and the signed
# full-flavor release APK live in exactly one place. Called with
# `secrets: inherit` by android-build.yml (push builds) and upstream-sync.yml
# (nightly sync builds).

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to build"
        type: string
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: printf '%s' "${{ secrets.NUVIO_RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/nuvio-release.keystore"

      - name: Write signing config
        run: |
          cat >> local.properties <<EOF
          NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/nuvio-release.keystore
          NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          EOF

      - name: Build signed full release APK
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_WATCHPARTY_SUPABASE_URL: ${{ secrets.NUVIO_WATCHPARTY_SUPABASE_URL }}
          NUVIO_WATCHPARTY_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_WATCHPARTY_SUPABASE_ANON_KEY }}
        run: ./gradlew :androidApp:assembleFullRelease

      # The build produces one APK per ABI (upstream ships ABI splits, no
      # universal APK). All of them must reach the release: the in-app updater
      # picks the asset whose name contains a supported ABI.
      - name: Collect APKs
        run: |
          VERSION=$(grep MARKETING_VERSION iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')
          # git HEAD, not GITHUB_SHA: on sync builds the checked-out merge SHA
          # differs from the SHA that triggered the calling workflow.
          SHA=$(git rev-parse --short HEAD)
          mkdir release-apks
          find androidApp/build/outputs/apk/full/release -name '*.apk' | while read -r APK_SRC; do
            ABI=$(basename "$APK_SRC" .apk)
            ABI=${ABI#androidApp-full-}
            ABI=${ABI%-release}
            cp "$APK_SRC" "release-apks/Nuvio-${VERSION}-full-${ABI}-${SHA}.apk"
          done
          ls release-apks/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-release-apk
          path: release-apks/*.apk
          if-no-files-found: error
